name: CI/CD Pipeline — Resume Screener

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SAM Application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true

      - name: Build SAM Application
        run: |
          sam build --use-container

  test:
    name: Run Quality Gates & Tests
    runs-on: ubuntu-latest
    needs: build
    env:
      AWS_DEFAULT_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Test Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m spacy download en_core_web_sm

      - name: Validate Skills & Dictionaries
        run: |
          python scripts/validate_data.py

      - name: Run Unit Tests
        env:
          RS_DATA_DIR: backend/data
        run: |
          pytest tests/unit --cov=backend/layers/common_layer/python/rs_common

      - name: Run Component Tests
        env:
          RS_DATA_DIR: backend/data
        run: |
          pytest tests/component

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm ci
          npm test -- --run

  deploy:
    name: Deploy Stack via CloudFormation Service Role
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::331262815638:role/resume-screener-github-actions-deploy
          aws-region: ap-south-1

      - name: Validate Target AWS Account ID (Account Safety Guard)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          echo "Authenticated Account: $ACCOUNT_ID"
          if [[ "$ACCOUNT_ID" != "331262815638" ]]; then
            echo "ERROR: Refusing deployment to unexpected account $ACCOUNT_ID!"
            exit 1
          fi

      - name: Build SAM Application
        run: |
          sam build --use-container

      - name: Deploy SAM Stack (Associating Dedicated CloudFormation Service Role)
        run: |
          sam deploy \
            --stack-name resume-screener-dev \
            --region ap-south-1 \
            --role-arn arn:aws:iam::331262815638:role/resume-screener-cloudformation-execution \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --resolve-image-repos \
            --parameter-overrides \
              EnvName=dev \
              SesSenderAddress=parth.choutapelly@gmail.com \
              CreateBudget=false

  verify:
    name: Read-Only Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::331262815638:role/resume-screener-github-actions-deploy
          aws-region: ap-south-1

      - name: Verify CloudFormation Stack Health & Execution Role
        run: |
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name resume-screener-dev \
            --query "Stacks[0].StackStatus" \
            --output text)
          STACK_ROLE=$(aws cloudformation describe-stacks \
            --stack-name resume-screener-dev \
            --query "Stacks[0].RoleARN" \
            --output text)
          echo "Stack Status: $STACK_STATUS"
          echo "Attached Role: $STACK_ROLE"
          if [[ "$STACK_STATUS" != "UPDATE_COMPLETE" && "$STACK_STATUS" != "CREATE_COMPLETE" ]]; then
            echo "Verification failed: Stack status is $STACK_STATUS"
            exit 1
          fi
          if [[ "$STACK_ROLE" != "arn:aws:iam::331262815638:role/resume-screener-cloudformation-execution" ]]; then
            echo "Verification failed: Stack RoleARN was not persisted correctly!"
            exit 1
          fi

      - name: Verify CloudFront Frontend Availability
        run: |
          HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" https://d1yg427uu45noj.cloudfront.net)
          echo "CloudFront HTTP status: $HTTP_STATUS"
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "Verification failed: CloudFront frontend returned $HTTP_STATUS (expected 200)"
            exit 1
          fi
