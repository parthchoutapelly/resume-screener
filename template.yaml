  ExtractionThrottles:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "rs-ExtractionThrottles-${EnvName}"
      AlarmDescription: Extraction function was throttled
      Namespace: AWS/Lambda
