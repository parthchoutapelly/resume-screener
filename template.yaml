AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AI-Powered Resume Screener & Talent Acquisition Pipeline.
  Phases 1-3: storage, database, queues, auth, alerting, ingestion (extraction +
  NLP), scoring, the recruiter REST API, dlqHandler and alarms.
  See docs/01-infrastructure-setup.md through docs/03-scoring-and-api.md.

Parameters:
  EnvName:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  SesSenderAddress:
    Type: String
    Description: SES-verified sender address for shortlist emails (T-004).
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email to subscribe to AlertsTopic.
  CreateBudget:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Budgets are account-wide, not stack-scoped — set true in at most ONE
      stack in this account. Defaults to false since this account already
      has an account-wide budget alert from another project.
  BudgetAmountUsd:
    Type: Number
    Default: 10
  AllowedOrigin:
    Type: String
    Default: "http://localhost:5173"
    Description: >
      The single browser origin allowed by API CORS (R-SEC-07). Defaults to the local
      Vite dev server. Once CloudFront is restored (template-web-hosting.yaml.deferred)
      this becomes https://${WebDistribution.DomainName}. Never a wildcard.

Conditions:
  IsDev: !Equals [!Ref EnvName, dev]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  MakeBudget: !Equals [!Ref CreateBudget, "true"]

Globals:
  Function:
    Architectures: [x86_64]
    Timeout: 10
    MemorySize: 256
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        ENV: !Ref EnvName
        LOG_LEVEL: INFO

Resources:
  # ---------------------------------------------------------------------
  # S3 — upload bucket (JDs, resumes, exports)
  # ---------------------------------------------------------------------
  UploadBucket:
    Type: AWS::S3::Bucket
    DependsOn: IngestionQueuePolicy  # no cycle: the policy references the bucket by name string, not !Ref
    Properties:
      BucketName: !Sub resume-screener-${EnvName}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST, GET]
            AllowedOrigins: !If
              - IsDev
              - [!Sub "https://${WebDistribution.DomainName}", "http://localhost:5173"]
              - [!Sub "https://${WebDistribution.DomainName}"]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: expire-exports
            Status: Enabled
            Prefix: exports/
            ExpirationInDays: 7
          - Id: expire-jds
            Status: Enabled
            Prefix: jd-uploads/
            ExpirationInDays: 180
          - Id: expire-resumes
            Status: Enabled
            Prefix: resume-uploads/
            ExpirationInDays: 180
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt IngestionQueue.Arn
            Filter: {S3Key: {Rules: [{Name: prefix, Value: jd-uploads/}]}}
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt IngestionQueue.Arn
            Filter: {S3Key: {Rules: [{Name: prefix, Value: resume-uploads/}]}}
        # exports/ is intentionally not wired.

  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt UploadBucket.Arn
              - !Sub "${UploadBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # ---------------------------------------------------------------------
  # Web hosting — S3 + CloudFront (restored from template-web-hosting.yaml.deferred
  # after AWS Support verified the account for CloudFront, 2026-09-25)
  # ---------------------------------------------------------------------
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub resume-screener-web-${EnvName}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub rs-web-oac-${EnvName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub rs-web-headers-${EnvName}
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: same-origin
            Override: true
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub >-
              default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline';
              connect-src 'self' https://*.execute-api.${AWS::Region}.amazonaws.com
              https://cognito-idp.${AWS::Region}.amazonaws.com
              https://*.s3.${AWS::Region}.amazonaws.com https://*.s3.amazonaws.com;
              frame-ancestors 'none'

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_200
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt WebOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref WebHeadersPolicy
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt WebBucket.Arn
              - !Sub "${WebBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # -------------------------------------------------------------------
  # DynamoDB
  # ---------------------------------------------------------------------
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub jobs-${EnvName}
      BillingMode: PAY_PER_REQUEST
      SSESpecification: {SSEEnabled: true}
      AttributeDefinitions:
        - {AttributeName: job_id, AttributeType: S}
        - {AttributeName: recruiter_id, AttributeType: S}
        - {AttributeName: created_at, AttributeType: S}
      KeySchema:
        - {AttributeName: job_id, KeyType: HASH}
      GlobalSecondaryIndexes:
        - IndexName: RecruiterJobsIndex
          KeySchema:
            - {AttributeName: recruiter_id, KeyType: HASH}
            - {AttributeName: created_at, KeyType: RANGE}
          Projection: {ProjectionType: ALL}

  CandidatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub candidates-${EnvName}
      BillingMode: PAY_PER_REQUEST
      SSESpecification: {SSEEnabled: true}
      AttributeDefinitions:
        - {AttributeName: job_id, AttributeType: S}
        - {AttributeName: candidate_id, AttributeType: S}
      KeySchema:
        - {AttributeName: job_id, KeyType: HASH}
        - {AttributeName: candidate_id, KeyType: RANGE}
      # No GSI — JobScoreIndex removed (D-16): a sparse index hid unscored
      # rows. getCandidatesByJob uses a base-table Query + in-Lambda sort.

  FailedJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub failed_jobs-${EnvName}
      BillingMode: PAY_PER_REQUEST
      SSESpecification: {SSEEnabled: true}
      AttributeDefinitions:
        - {AttributeName: job_id, AttributeType: S}
        - {AttributeName: failure_id, AttributeType: S}
      KeySchema:
        - {AttributeName: job_id, KeyType: HASH}
        - {AttributeName: failure_id, KeyType: RANGE}
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  ConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub config-${EnvName}
      BillingMode: PAY_PER_REQUEST
      SSESpecification: {SSEEnabled: true}
      AttributeDefinitions:
        - {AttributeName: config_key, AttributeType: S}
      KeySchema:
        - {AttributeName: config_key, KeyType: HASH}

  # ---------------------------------------------------------------------
  # SQS — ingestion + scoring, each with a DLQ
  # ---------------------------------------------------------------------
  IngestionDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub rs-ingestion-dlq-${EnvName}
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ScoringDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub rs-scoring-dlq-${EnvName}
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  IngestionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub rs-ingestion-${EnvName}
      VisibilityTimeout: 720  # 6x ExtractionFunction's 120s timeout
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestionDLQ.Arn
        maxReceiveCount: 3

  ScoringQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub rs-scoring-${EnvName}
      VisibilityTimeout: 60  # 6x scoreMatch's 10s timeout
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ScoringDLQ.Arn
        maxReceiveCount: 5

  IngestionQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref IngestionQueue]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt IngestionQueue.Arn
            Condition:
              ArnEquals:
                "aws:SourceArn": !Sub "arn:aws:s3:::resume-screener-${EnvName}-${AWS::AccountId}"
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId

  # ---------------------------------------------------------------------
  # Cognito
  # ---------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub resume-screener-users-${EnvName}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - {Name: admin_only, Priority: 1}
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub resume-screener-web-${EnvName}
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 7
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days

  RecruiterGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {UserPoolId: !Ref UserPool, GroupName: Recruiter}

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {UserPoolId: !Ref UserPool, GroupName: Admin}

  # ---------------------------------------------------------------------
  # SNS + Budget (alarms themselves are added in phase 3)
  # ---------------------------------------------------------------------
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub rs-alerts-${EnvName}
      Subscription: !If
        - HasAlertEmail
        - [{Protocol: email, Endpoint: !Ref AlertEmail}]
        - !Ref AWS::NoValue

  AlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertsTopic]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: [budgets.amazonaws.com, cloudwatch.amazonaws.com]
            Action: sns:Publish
            Resource: !Ref AlertsTopic

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: MakeBudget
    Properties:
      Budget:
        BudgetName: resume-screener-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref BudgetAmountUsd, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: SNS, Address: !Ref AlertsTopic}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: SNS, Address: !Ref AlertsTopic}]

  # ---------------------------------------------------------------------
  # Lambda — extraction + NLP (phase 2, container images); scoring/API/reliability follow
  # ---------------------------------------------------------------------
  ExtractionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub rs-extraction-${EnvName}
      PackageType: Image
      Timeout: 120
      MemorySize: 1536
      EphemeralStorage: {Size: 1024}
      Environment:
        Variables:
          NLP_FUNCTION_NAME: !Ref NlpFunction
          JOBS_TABLE: !Ref JobsTable
          CANDIDATES_TABLE: !Ref CandidatesTable
          FAILED_JOBS_TABLE: !Ref FailedJobsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub "${UploadBucket.Arn}/jd-uploads/*"
                - !Sub "${UploadBucket.Arn}/resume-uploads/*"
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: [!GetAtt JobsTable.Arn, !GetAtt CandidatesTable.Arn]
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt FailedJobsTable.Arn
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt NlpFunction.Arn
      Events:
        Ingestion:
          Type: SQS
          Properties:
            Queue: !GetAtt IngestionQueue.Arn
            BatchSize: 1
            ScalingConfig: {MaximumConcurrency: 3}  # D-25
    Metadata:
      # Docker context is ./backend (not this directory), so the image can
      # COPY rs_common directly — container functions can't use layers
      # (docs/02-ingestion-pipeline.md §6.1).
      Dockerfile: ingestion/extraction/Dockerfile
      DockerContext: ./backend
      DockerTag: python3.12-v2
  ExtractionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/rs-extraction-${EnvName}", RetentionInDays: 30}

  NlpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub rs-nlp-${EnvName}
      # PackageType: Image, not zip+layers — D-56 (docs/Memory.md): the real
      # built NlpLayer measured 310 MB unzipped (over Lambda's 250 MB
      # function+layers combined limit). This is D-03's own pre-agreed
      # fallback ("NLP exceeds 250 MB -> then NLP -> image"), the same
      # pattern ExtractionFunction already uses. No native-binary dependency
      # here, so it uses the official AWS Lambda Python base image directly.
      PackageType: Image
      Timeout: 60  # generous headroom for a container-image cold start loading spaCy
      MemorySize: 1536
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          CANDIDATES_TABLE: !Ref CandidatesTable
          CONFIG_TABLE: !Ref ConfigTable
          SCORING_QUEUE_URL: !Ref ScoringQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: [!GetAtt JobsTable.Arn, !GetAtt CandidatesTable.Arn]
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt CandidatesTable.Arn
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt ConfigTable.Arn
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt ScoringQueue.Arn
      # No Events — invoked only by ExtractionFunction (synchronous lambda:Invoke).
    Metadata:
      Dockerfile: ingestion/nlp/Dockerfile
      DockerContext: ./backend
      DockerTag: python3.12-v1
  NlpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/rs-nlp-${EnvName}", RetentionInDays: 30}

  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub rs-common-${EnvName}
      ContentUri: backend/
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [x86_64]
    Metadata: {BuildMethod: makefile}
    # Still used by the zip-packaged phase-3 functions (scoreMatch, the API
    # routes) — NlpFunction no longer needs it now that it's an image
    # (container functions can't use layers; rs_common is COPYed directly).

  # ---------------------------------------------------------------------
  # Scoring (phase 3) — SQS-triggered; "not ready" is acked, never retried (D-18)
  # ---------------------------------------------------------------------
  ScoreMatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub rs-score-match-${EnvName}
      CodeUri: backend/scoring/score_match/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 256
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          CANDIDATES_TABLE: !Ref CandidatesTable
          FAILED_JOBS_TABLE: !Ref FailedJobsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt JobsTable.Arn
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt CandidatesTable.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt FailedJobsTable.Arn
      Events:
        Scoring:
          Type: SQS
          Properties:
            Queue: !GetAtt ScoringQueue.Arn
            BatchSize: 1
            ScalingConfig: {MaximumConcurrency: 2}  # D-25
  ScoreMatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/rs-score-match-${EnvName}", RetentionInDays: 30}

  # ---------------------------------------------------------------------
  # REST API — Cognito authorizer, single CORS origin, throttled (R-AUTH-01, R-SEC-07/10)
  # ---------------------------------------------------------------------
  RecruiterApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub rs-api-${EnvName}
      StageName: !Ref EnvName
      Cors:
        AllowOrigin: !Sub "'${AllowedOrigin}'"
        AllowMethods: "'GET,POST,PATCH,OPTIONS'"
        AllowHeaders: "'Authorization,Content-Type'"
        MaxAge: "'600'"
      Auth:
        DefaultAuthorizer: CognitoAuth
        AddDefaultAuthorizerToCorsPreflight: false  # preflight must not need a token
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt UserPool.Arn
            Identity: {Header: Authorization}  # raw ID token, no "Bearer " prefix (D-47)
      GatewayResponses:  # 401/403/429/5xx produced by the gateway itself still carry CORS
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
      MethodSettings:
        - {ResourcePath: "/*", HttpMethod: "*", ThrottlingRateLimit: 20, ThrottlingBurstLimit: 40}

  # ---------------------------------------------------------------------
  # API functions — IAM exactly per docs/Architecture.md §8.1
  # ---------------------------------------------------------------------
  CreateJobPostingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub rs-create-job-posting-${EnvName}
      CodeUri: backend/api/create_job_posting/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          JOBS_TABLE: !Ref JobsTable
          CANDIDATES_TABLE: !Ref CandidatesTable
          FAILED_JOBS_TABLE: !Ref FailedJobsTable
          UPLOAD_BUCKET: !Ref UploadBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt JobsTable.Arn
            - Effect: Allow
              Action: dynamodb:BatchWriteItem
              Resource: !GetAtt CandidatesTable.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt FailedJobsTable.Arn
            - Effect: Allow
              Action: s3:PutObject
              Resource:
                - !Sub "${UploadBucket.Arn}/jd-uploads/*"
                - !Sub "${UploadBucket.Arn}/resume-uploads/*"
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RecruiterApi
            Path: /jobs
            Method: POST
  CreateJobPostingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/rs-create-job-posting-${EnvName}", RetentionInDays: 30}

  AddResumesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub rs-add-resumes-${EnvName}
      CodeUri: backend/api/add_resumes/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          JOBS_TABLE: !Ref JobsTable
          CANDIDATES_TABLE: !Ref CandidatesTable
          FAILED_JOBS_TABLE: !Ref FailedJobsTable
          UPLOAD_BUCKET: !Ref UploadBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt JobsTable.Arn
            - Effect: Allow
              Action: [dynamodb:BatchWriteItem, dynamodb:Query]
              Resource: !GetAtt CandidatesTable.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt FailedJobsTable.Arn
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${UploadBucket.Arn}/resume-uploads/*"
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RecruiterApi
            Path: /jobs/{job_id}/resumes
            Method: POST
  AddResumesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/rs-add-resumes-${EnvName}", RetentionInDays: 30}

  GetJobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub rs-get-jobs-${EnvName}
      CodeUri: backend/api/get_jobs/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          JOBS_TABLE: !Ref JobsTable
          FAILED_JOBS_TABLE: !Ref FailedJobsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:Scan]
              Resource:
                - !GetAtt JobsTable.Arn
                - !Sub "${JobsTable.Arn}/index/RecruiterJobsIndex"
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RecruiterApi
            Path: /jobs
            Method: GET
  GetJobsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/rs-get-jobs-${EnvName}", RetentionInDays: 30}

  GetJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub rs-get-job-${EnvName}
      CodeUri: backend/api/get_job/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          JOBS_TABLE: !Ref JobsTable
          FAILED_JOBS_TABLE: !Ref FailedJobsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt JobsTable.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RecruiterApi
            Path: /jobs/{job_id}
            Method: GET
  GetJobLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/rs-get-job-${EnvName}", RetentionInDays: 30}

  UpdateJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub rs-update-job-${EnvName}
      CodeUri: backend/api/update_job/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          JOBS_TABLE: !Ref JobsTable
          CANDIDATES_TABLE: !Ref CandidatesTable
          FAILED_JOBS_TABLE: !Ref FailedJobsTable
          SCORING_QUEUE_URL: !Ref ScoringQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt JobsTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt CandidatesTable.Arn
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt ScoringQueue.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RecruiterApi
            Path: /jobs/{job_id}
            Method: PATCH
  UpdateJobLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/rs-update-job-${EnvName}", RetentionInDays: 30}

  GetCandidatesByJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub rs-get-candidates-by-job-${EnvName}
      CodeUri: backend/api/get_candidates_by_job/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          JOBS_TABLE: !Ref JobsTable
          CANDIDATES_TABLE: !Ref CandidatesTable
          FAILED_JOBS_TABLE: !Ref FailedJobsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt JobsTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt CandidatesTable.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RecruiterApi
            Path: /jobs/{job_id}/candidates
            Method: GET
  GetCandidatesByJobLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/rs-get-candidates-by-job-${EnvName}", RetentionInDays: 30}

  UpdateCandidateDecisionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub rs-update-candidate-decision-${EnvName}
      CodeUri: backend/api/update_candidate_decision/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          JOBS_TABLE: !Ref JobsTable
          CANDIDATES_TABLE: !Ref CandidatesTable
          FAILED_JOBS_TABLE: !Ref FailedJobsTable
          SES_SENDER_ADDRESS: !Ref SesSenderAddress
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt JobsTable.Arn
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt CandidatesTable.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt FailedJobsTable.Arn
            - Effect: Allow
              Action: ses:SendEmail
              # In SES sandbox the recipient identity is also authorized, so the resource is
              # account-scoped; the FromAddress condition is the tight control (docs/03 §9).
              Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
              Condition:
                StringEquals:
                  "ses:FromAddress": !Ref SesSenderAddress
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RecruiterApi
            Path: /jobs/{job_id}/candidates/{candidate_id}/decision
            Method: POST
  UpdateCandidateDecisionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/rs-update-candidate-decision-${EnvName}", RetentionInDays: 30}

  GetResumeUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub rs-get-resume-url-${EnvName}
      CodeUri: backend/api/get_resume_url/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          JOBS_TABLE: !Ref JobsTable
          CANDIDATES_TABLE: !Ref CandidatesTable
          FAILED_JOBS_TABLE: !Ref FailedJobsTable
          UPLOAD_BUCKET: !Ref UploadBucket
          FEATURE_RESUME_VIEW: "true"
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource:
                - !GetAtt JobsTable.Arn
                - !GetAtt CandidatesTable.Arn
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${UploadBucket.Arn}/resume-uploads/*"
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RecruiterApi
            Path: /jobs/{job_id}/candidates/{candidate_id}/resume-url
            Method: GET
  GetResumeUrlLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/rs-get-resume-url-${EnvName}", RetentionInDays: 30}

  ExportShortlistCsvFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub rs-export-shortlist-csv-${EnvName}
      CodeUri: backend/api/export_shortlist_csv/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          JOBS_TABLE: !Ref JobsTable
          CANDIDATES_TABLE: !Ref CandidatesTable
          FAILED_JOBS_TABLE: !Ref FailedJobsTable
          UPLOAD_BUCKET: !Ref UploadBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt JobsTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt CandidatesTable.Arn
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject]
              Resource: !Sub "${UploadBucket.Arn}/exports/*"
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RecruiterApi
            Path: /jobs/{job_id}/export
            Method: GET
  ExportShortlistCsvLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/rs-export-shortlist-csv-${EnvName}", RetentionInDays: 30}

  GetFailedJobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub rs-get-failed-jobs-${EnvName}
      CodeUri: backend/api/get_failed_jobs/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          JOBS_TABLE: !Ref JobsTable
          FAILED_JOBS_TABLE: !Ref FailedJobsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:Scan]
              Resource: !GetAtt FailedJobsTable.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RecruiterApi
            Path: /failed-jobs
            Method: GET
  GetFailedJobsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/rs-get-failed-jobs-${EnvName}", RetentionInDays: 30}

  # ---------------------------------------------------------------------
  # Reliability — dlqHandler drains both DLQs into visible terminal states
  # ---------------------------------------------------------------------
  DlqHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub rs-dlq-handler-${EnvName}
      CodeUri: backend/reliability/dlq_handler/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          CANDIDATES_TABLE: !Ref CandidatesTable
          FAILED_JOBS_TABLE: !Ref FailedJobsTable
          INGESTION_DLQ_ARN: !GetAtt IngestionDLQ.Arn
      Policies:
        # Metrics go out as Embedded Metric Format on stdout (D-49): no cloudwatch:PutMetricData needed.
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: [!GetAtt JobsTable.Arn, !GetAtt CandidatesTable.Arn]
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt FailedJobsTable.Arn
      Events:
        IngestionDlq:
          Type: SQS
          Properties: {Queue: !GetAtt IngestionDLQ.Arn, BatchSize: 1}
        ScoringDlq:
          Type: SQS
          Properties: {Queue: !GetAtt ScoringDLQ.Arn, BatchSize: 1}
  DlqHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/rs-dlq-handler-${EnvName}", RetentionInDays: 30}

  # ---------------------------------------------------------------------
  # Alarms -> AlertsTopic (docs/03 §8). Deliberately NOT on DLQ
  # ApproximateNumberOfMessagesVisible: dlqHandler drains them, so it always reads 0 (D-32).
  # ---------------------------------------------------------------------
  TerminalFailuresIngestion:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "rs-TerminalFailuresIngestion-${EnvName}"
      AlarmDescription: A ingestion message exhausted its retries and became a terminal failure
      Namespace: ResumeScreener
      MetricName: TerminalFailures
      Dimensions:
        - {Name: Queue, Value: ingestion}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  TerminalFailuresScoring:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "rs-TerminalFailuresScoring-${EnvName}"
      AlarmDescription: A scoring message exhausted its retries and became a terminal failure
      Namespace: ResumeScreener
      MetricName: TerminalFailures
      Dimensions:
        - {Name: Queue, Value: scoring}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  IngestionDlqReceived:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "rs-IngestionDlqReceived-${EnvName}"
      AlarmDescription: A message reached the ingestion DLQ
      Namespace: AWS/SQS
      MetricName: NumberOfMessagesReceived
      Dimensions:
        - {Name: QueueName, Value: !GetAtt IngestionDLQ.QueueName}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  ScoringDlqReceived:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "rs-ScoringDlqReceived-${EnvName}"
      AlarmDescription: A message reached the scoring DLQ
      Namespace: AWS/SQS
      MetricName: NumberOfMessagesReceived
      Dimensions:
        - {Name: QueueName, Value: !GetAtt ScoringDLQ.QueueName}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  ExtractionErrors:
